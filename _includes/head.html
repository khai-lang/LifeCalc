<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
  {% if page.title %}
    {{ page.title }} | LifeCalc
  {% else %}
    {{ site.title | default: "LifeCalc" }}
  {% endif %}
</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="LifeCalc">

<meta property="og:title"
      content="{% if page.title %}{{ page.title }} | LifeCalc{% else %}LifeCalc | 생활·세금·건강 계산기{% endif %}">

<meta property="og:description"
      content="{% if page.description %}{{ page.description }}{% else %}생활, 급여, 세금, 건강 계산기를 한곳에 모은 LifeCalc{% endif %}">

<meta property="og:url" content="{{ page.url | absolute_url }}">

{% if page.og_image %}
<meta property="og:image" content="{{ page.og_image | absolute_url }}">
{% else %}
<meta property="og:image" content="{{ '/images/og-lifecalc.png' | absolute_url }}">
{% endif %}

<meta name="description" content="{{ page.description | default: site.description }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">

{% seo %}

<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

<style>
  /* ★ 모든 링크 밑줄 강제 제거 */
  a { text-decoration: none !important; }

  /* 1. 최상위 헤더 배경을 네이비로 채우고 중앙 축 고정 */
  header, .site-header {
    width: 100% !important;
    background: #0b5a7a !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    border: none !important;
    box-shadow: none !important;
  }

  /* 2. 헤더 영역 전체 가운데 정렬 및 간격 고정 (통합본) */
  .header-wrap {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    max-width: 1100px !important;
    width: 100% !important;
    margin: 0 auto !important;
    padding: 14px 20px !important;
    background: #0b5a7a !important;
    gap: 60px !important;
    float: none !important;
  }

  /* 3. 데스크톱에서 가로폭이 찌그러지는 현상 방지 및 메뉴 밀림 방지 */
  .header-wrap .logo,
  .header-wrap .site-nav {
    flex: none !important;
    width: auto !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    flex-grow: 0 !important;
  }

  .header-wrap .nav-ul {
    margin-left: 0 !important;
    margin-right: 0 !important;
    flex-grow: 0 !important;
  }

  /* 4. 모바일 화면(940px 이하) 대응 */
  @media (max-width: 940px) {
    .header-wrap {
      justify-content: space-between !important;
      gap: 0 !important;
      padding: 12px 16px !important;
    }
  }

  /* ★ 전체 페이지 배경 살구톤 보정 */
  body { background: #fff7ef !important; }

  /* ★ 드롭다운 메뉴 배경 강제 보정 */
  .drop .menu {
    background: #fff8f1 !important;
    border: 1px solid #f3e6db !important;
  }

  /* ★ 박스/카드 배경 강제 보정 */
  .card, .promo-card, .box {
    background: #fff3e8 !important;
    border: 1px solid #f3e6db !important;
  }

  /* ★ 푸터 강제 복구 */
  footer {
    background: #fcf9f6 !important;
    color: #777 !important;
    padding: 20px 0 !important;
    text-align: center !important;
  }
</style>
